name: Bug report
description: Report a reproducible session recovery problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste session content, credentials, or full profile files.
  - type: input
    id: versions
    attributes: { label: Versions, description: Plugin, DSH, and Portable versions }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: result
    attributes: { label: Expected and actual result }
    validations: { required: true }
