name: Risk-based CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      behavior: ${{ steps.plan.outputs.behavior }}
      delivery: ${{ steps.plan.outputs.delivery }}
      official: ${{ steps.plan.outputs.official }}
      dsh_versions: ${{ steps.plan.outputs.dsh_versions }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, package-manager-cache: false }
      - name: Classify risk and refuse unpublished runtime drift
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          published="$(npm view dsh-chat-manager dist-tags.latest)"
          node scripts/ci-change-plan.mjs --base "$BASE_SHA" --published "$published"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const c=JSON.parse(readFileSync('compatibility.json','utf8'));
          const response=await fetch('https://registry.npmjs.org/@deepseek-ai%2fdsh');
          if(!response.ok)throw Error(`Registry HTTP ${response.status}`);
          const registry=await response.json(),tags=registry['dist-tags'];
          const versions=[...c.releaseTargets,...(c.portableBaselines||[]).filter(v=>!c.releaseTargets.includes(v))];
          for(const version of versions)if(!registry.versions[version])throw Error(`Unpublished DSH ${version}`);
          console.log('dsh_versions='+JSON.stringify(versions));
          NODE

  behavior:
    needs: plan
    if: needs.plan.outputs.behavior == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run archive, restore, cancel, and deletion behavior
        run: pnpm run test:behavior
      - run: pnpm run build
      - run: git diff --exit-code -- lib
      - run: pnpm pack --pack-destination .artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: chat-manager-${{ github.sha }}
          path: .artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true

  delivery:
    needs: plan
    if: needs.plan.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:delivery

  official-dsh:
    name: Official DSH browser acceptance (${{ matrix.dsh_version }})
    needs: [plan, behavior]
    if: needs.plan.outputs.official == 'true' && needs.behavior.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh_version: ${{ fromJSON(needs.plan.outputs.dsh_versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        id: acceptance-pnpm
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: chat-manager-${{ github.sha }}
          path: .candidate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify archive, restore, cancel and confirmed deletion of the generated test session
        env:
          DSH_TEST_PNPM_ROOT: ${{ steps.acceptance-pnpm.outputs.dest }}/node_modules/pnpm
          DSH_ACCEPTANCE_EVIDENCE_ROOT: ${{ runner.temp }}/dsh-chat-manager-evidence
        shell: pwsh
        run: |
          $Candidates = @(Get-ChildItem -LiteralPath .candidate -Filter '*.tgz' -File)
          if ($Candidates.Count -ne 1) { throw 'Expected exactly one qualified candidate package.' }
          node scripts/accept-official-dsh.mjs --dsh-version "${{ matrix.dsh_version }}" --package $Candidates[0].FullName
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chat-evidence-${{ matrix.dsh_version }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dsh-chat-manager-evidence/dsh-session-delete-official-*/acceptance.json
            ${{ runner.temp }}/dsh-chat-manager-evidence/dsh-session-delete-official-*/fixture-status.json
            ${{ runner.temp }}/dsh-chat-manager-evidence/dsh-session-delete-official-*/web.log
            ${{ runner.temp }}/dsh-chat-manager-evidence/dsh-session-delete-official-*/*.png
            ${{ runner.temp }}/dsh-chat-manager-evidence/dsh-session-delete-official-*/modern-failure.txt
