name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 22.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
      - run: git diff --exit-code -- lib
      - run: pnpm pack --pack-destination .artifacts
      - name: Refuse legacy manager capabilities in the package
        shell: bash
        run: |
          package="$(find .artifacts -name '*.tgz' -print -quit)"
          tar -tzf "$package" | grep -q 'package/lib/client.js'
          if tar -tzf "$package" | grep -E 'delete-session|archive-manager|search'; then exit 1; fi
