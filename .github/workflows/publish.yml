name: Publish beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
      - name: Build immutable candidate
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          file="$(find .artifacts -name '*.tgz' -print -quit)"
          mv "$file" .artifacts/dsh-chat-manager.tgz
          (cd .artifacts && sha256sum dsh-chat-manager.tgz > dsh-chat-manager.tgz.sha256)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish npm beta if absent
        shell: bash
        run: |
          version='${{ steps.package.outputs.version }}'
          if [ "$(npm view "dsh-chat-manager@$version" version 2>/dev/null || true)" != "$version" ]; then
            npm publish .artifacts/dsh-chat-manager.tgz --access public --tag beta --provenance
          fi
      - name: Publish GitHub prerelease if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version='${{ steps.package.outputs.version }}'
          tag="v$version"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "DSH Chat Manager $tag" \
              --notes "Narrows the existing removable Chat Manager to archived-session recovery without replacing native session management." \
              .artifacts/dsh-chat-manager.tgz .artifacts/dsh-chat-manager.tgz.sha256
          fi
