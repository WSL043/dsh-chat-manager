name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Require main and resolve version
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build
      - run: git diff --exit-code -- lib

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify guided installer lifecycle
        shell: powershell
        run: node --test tests/powershell-manager.test.mjs tests/powershell-setup.test.mjs

  release:
    needs: [verify, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Refuse an existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$GITHUB_SHA" ]; then
            echo "$RELEASE_TAG already points to another commit; refusing to move it." >&2
            exit 1
          fi
      - name: Build release assets
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          git diff --exit-code -- lib
          rm -rf .artifacts
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          package="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          mv "$package" .artifacts/dsh-session-delete.tgz
          cp dsh-session-delete.ps1 .artifacts/dsh-session-delete.ps1
          cp dsh-session-delete-setup.ps1 .artifacts/dsh-session-delete-setup.ps1
          (cd .artifacts && sha256sum dsh-session-delete.tgz > dsh-session-delete.tgz.sha256)
          (cd .artifacts && sha256sum dsh-session-delete.ps1 > dsh-session-delete.ps1.sha256)
          (cd .artifacts && sha256sum dsh-session-delete-setup.ps1 > dsh-session-delete-setup.ps1.sha256)
          for asset in dsh-session-delete.tgz dsh-session-delete.tgz.sha256 \
            dsh-session-delete.ps1 dsh-session-delete.ps1.sha256 \
            dsh-session-delete-setup.ps1 dsh-session-delete-setup.ps1.sha256; do
            test -s ".artifacts/$asset"
          done
          tar -xOf .artifacts/dsh-session-delete.tgz package/package.json \
            | jq -e --arg version "$RELEASE_VERSION" '.version == $version' >/dev/null
      - name: Write release notes
        shell: bash
        run: |
          cat > .artifacts/release.md <<'NOTES'
          ## 安装体验 / Installation experience

          - 新增 Windows 一行安装助手，自动发现普通 DSH 与 DSH-Portable。
          - 安装器会校验下载的管理脚本、记录目标 DSH，并在卸载时恢复原 workspace 依赖。
          - 安装后可用 `dsh-session-delete update` 和 `dsh-session-delete uninstall`。
          - 安装只调用一次 DSH 插件操作，并实时显示进度，不再重复下载插件包或执行多次列表扫描。
          - 不需要管理员权限，不会安装系统 Node.js/pnpm，也不会自动重启 DSH。

          - Adds a one-line Windows guided setup for standard DSH and DSH-Portable.
          - Verifies the downloaded manager, remembers the target, and restores the previous workspace dependency on uninstall.
          - Adds `dsh-session-delete update` and `dsh-session-delete uninstall` commands.
          - Uses one DSH plugin operation and streams progress instead of downloading the package twice or repeatedly listing plugins.
          - Requires no administrator access or system Node.js/pnpm install and never restarts DSH automatically.

          ```powershell
          $u='https://github.com/WSL043/dsh-session-delete/releases/download/v0.1.7'; $p="$env:TEMP\dsh-session-delete-setup.ps1"; curl.exe -fL "$u/dsh-session-delete-setup.ps1" -o $p; curl.exe -fL "$u/dsh-session-delete-setup.ps1.sha256" -o "$p.sha256"; if ($LASTEXITCODE -ne 0) { throw 'Download failed' }; $want=((Get-Content "$p.sha256" -Raw) -split '\s+')[0]; if ((Get-FileHash $p -Algorithm SHA256).Hash -ne $want) { throw 'Checksum mismatch' }; powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p
          ```
          NOTES
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DSH Session Delete $RELEASE_TAG" \
            --notes-file .artifacts/release.md \
            .artifacts/dsh-session-delete.tgz \
            .artifacts/dsh-session-delete.tgz.sha256 \
            .artifacts/dsh-session-delete.ps1 \
            .artifacts/dsh-session-delete.ps1.sha256 \
            .artifacts/dsh-session-delete-setup.ps1 \
            .artifacts/dsh-session-delete-setup.ps1.sha256
