name: Release
run-name: Release ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional correlation id used by the compatibility autopilot
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Require main and resolve version
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build
      - run: git diff --exit-code -- lib

  windows-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test tests/windows-installer.test.mjs

  release:
    needs: [verify, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@12.0.2
      - name: Inspect immutable release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              | jq -e '.draft == false and .prerelease == false and .immutable == true' >/dev/null
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
            if [ -n "$remote_tag" ] && [ "$remote_tag" != "$GITHUB_SHA" ]; then
              echo "$RELEASE_TAG already points to another commit; refusing to move it." >&2
              exit 1
            fi
          fi
      - name: Build release assets
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          git diff --exit-code -- lib
          rm -rf .artifacts
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          package="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          mv "$package" .artifacts/dsh-native-session-delete.tgz
          cp install.ps1 .artifacts/install.ps1
          (cd .artifacts && sha256sum dsh-native-session-delete.tgz > dsh-native-session-delete.tgz.sha256)
          (cd .artifacts && sha256sum install.ps1 > install.ps1.sha256)
          for asset in dsh-native-session-delete.tgz dsh-native-session-delete.tgz.sha256 install.ps1 install.ps1.sha256; do
            test -s ".artifacts/$asset"
          done
          grep -F "dsh-native-session-delete@${RELEASE_VERSION}" .artifacts/install.ps1
          tar -xOf .artifacts/dsh-native-session-delete.tgz package/package.json \
            | jq -e --arg version "$RELEASE_VERSION" \
              '.name == "dsh-native-session-delete" and .version == $version and .dsh.bundle.patch == "./cordis.patch.yml"' >/dev/null
      - name: Write release notes
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          DSH_VERSION="$(node -p "require('./compatibility.json').latestTested")"
          cat > .artifacts/release.md <<NOTES
          ## 更新内容

          - 支持 DeepSeek Harness \`${DSH_VERSION}\`。
          - 在会话原生菜单中提供红色“删除会话…”操作。
          - 删除前需要二次确认，成功后原地更新会话列表。
          - 永久删除不可撤销。

          ## 安装或更新

          \`\`\`powershell
          irm 'https://github.com/WSL043/dsh-native-session-delete/releases/download/v${RELEASE_VERSION}/install.ps1' | iex
          \`\`\`

          ## What's changed

          - Supports DeepSeek Harness \`${DSH_VERSION}\`.
          - Adds the red **Delete session…** action to the native session menu.
          - Requires a second confirmation and updates the session list in place after deletion.
          - Permanent deletion cannot be undone.
          NOTES
      - name: Publish immutable npm package
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package=.artifacts/dsh-native-session-delete.tgz
          spec="dsh-native-session-delete@$RELEASE_VERSION"
          remote_integrity="$(npm view "$spec" dist.integrity 2>/dev/null || true)"
          if [ -n "$remote_integrity" ]; then
            remote_tarball="$(npm view "$spec" dist.tarball)"
            remote_package="$(mktemp)"
            curl --fail --location --silent --show-error "$remote_tarball" --output "$remote_package"
            downloaded_integrity="sha512-$(openssl dgst -sha512 -binary "$remote_package" | base64 -w0)"
            test "$downloaded_integrity" = "$remote_integrity"
            local_tree="$(mktemp -d)"
            remote_tree="$(mktemp -d)"
            tar -xzf "$package" -C "$local_tree"
            tar -xzf "$remote_package" -C "$remote_tree"
            diff -qr --strip-trailing-cr "$local_tree/package" "$remote_tree/package"
            mv "$remote_package" "$package"
          else
            npm publish "$package" --access public --provenance
          fi
          (cd .artifacts && sha256sum dsh-native-session-delete.tgz > dsh-native-session-delete.tgz.sha256)
      - name: Verify existing immutable release assets
        if: steps.release_state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
          for asset in dsh-native-session-delete.tgz dsh-native-session-delete.tgz.sha256 install.ps1 install.ps1.sha256; do
            test -s "$existing/$asset"
          done
          (cd "$existing" && sha256sum -c dsh-native-session-delete.tgz.sha256 && sha256sum -c install.ps1.sha256)
          cmp "$existing/dsh-native-session-delete.tgz" .artifacts/dsh-native-session-delete.tgz
          cmp "$existing/install.ps1" .artifacts/install.ps1
      - name: Publish immutable release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DSH Native Session Delete $RELEASE_TAG" \
            --notes-file .artifacts/release.md \
            .artifacts/dsh-native-session-delete.tgz \
            .artifacts/dsh-native-session-delete.tgz.sha256 \
            .artifacts/install.ps1 \
            .artifacts/install.ps1.sha256
