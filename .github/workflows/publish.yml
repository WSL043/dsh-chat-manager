name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Require main and resolve version
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build
      - run: git diff --exit-code -- lib

  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test tests/windows-installer.test.mjs

  release:
    needs: [verify, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Refuse an existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$GITHUB_SHA" ]; then
            echo "$RELEASE_TAG already points to another commit; refusing to move it." >&2
            exit 1
          fi
      - name: Build release assets
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          git diff --exit-code -- lib
          rm -rf .artifacts
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          package="$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          mv "$package" .artifacts/dsh-native-session-delete.tgz
          cp install.ps1 .artifacts/install.ps1
          (cd .artifacts && sha256sum dsh-native-session-delete.tgz > dsh-native-session-delete.tgz.sha256)
          (cd .artifacts && sha256sum install.ps1 > install.ps1.sha256)
          for asset in dsh-native-session-delete.tgz dsh-native-session-delete.tgz.sha256 install.ps1 install.ps1.sha256; do
            test -s ".artifacts/$asset"
          done
          grep -F "releases/download/v${RELEASE_VERSION}/dsh-native-session-delete.tgz" .artifacts/install.ps1
          tar -xOf .artifacts/dsh-native-session-delete.tgz package/package.json \
            | jq -e --arg version "$RELEASE_VERSION" \
              '.name == "dsh-native-session-delete" and .version == $version and .dsh.bundle.patch == "./cordis.patch.yml"' >/dev/null
      - name: Write release notes
        shell: bash
        run: |
          cat > .artifacts/release.md <<'NOTES'
          ## 安装体验 / Installation experience

          - 新增秒级 Windows 薄安装助手，快速定位普通 DSH 或 DSH-Portable。
          - 助手只调用一次官方 `dsh plugin add`，不扫盘、不装包管理器、不保存 profile 快照。
          - 标准 DSH bundle 与卸载恢复机制保持不变。

          - Adds a fast, thin Windows helper for regular DSH and DSH-Portable discovery.
          - Calls the official `dsh plugin add` exactly once, with no disk scan, package-manager bootstrap, or profile snapshot.
          - Keeps the standard DSH bundle and uninstall restoration model unchanged.

          ```powershell
          irm 'https://github.com/WSL043/dsh-session-delete/releases/download/v1.0.1/install.ps1' | iex
          ```
          NOTES
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DSH Session Delete $RELEASE_TAG" \
            --notes-file .artifacts/release.md \
            .artifacts/dsh-native-session-delete.tgz \
            .artifacts/dsh-native-session-delete.tgz.sha256 \
            .artifacts/install.ps1 \
            .artifacts/install.ps1.sha256
