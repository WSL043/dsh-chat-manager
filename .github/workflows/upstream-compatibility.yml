name: DSH compatibility autopilot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      check_published:
        description: Verify the published baseline and qualify without promoting a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dsh-v2-upstream
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      run: ${{ steps.candidate.outputs.run }}
      promote: ${{ steps.candidate.outputs.promote }}
      changed: ${{ steps.plan.outputs.changed }}
      versions: ${{ steps.plan.outputs.versions }}
      version: ${{ steps.plan.outputs.version }}
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24.22.1, package-manager-cache: false }
      - name: Resolve the released v2 baseline
        id: candidate
        env:
          CHECK_PUBLISHED: ${{ inputs.check_published }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$CHECK_PUBLISHED" != true ]]; then
            printf 'run=true\npromote=false\nrecover=false\n' >> "$GITHUB_OUTPUT"
            exit
          fi
          [[ "$GITHUB_REF" == refs/heads/main ]]
          published="$(npm view dsh-chat-manager dist-tags.latest)"
          if [[ ! "$published" =~ ^2\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Scheduled delivery starts after the first v2 release. A manual run qualifies the candidate.' >> "$GITHUB_STEP_SUMMARY"
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit
          fi
          current="$(node -p 'require("./package.json").version')"
          recover=false
          anchor="$published"
          if [[ "$current" != "$published" ]] || ! gh release view "v$published" >/dev/null 2>&1; then
            anchor="$(node -p 'require("./compatibility.json").autoFollowFrom ?? ""')"
            if [[ ! "$anchor" =~ ^2\.[0-9]+\.[0-9]+$ ]]; then
              echo 'A maintainer release is pending; no compatibility package prepared.' >> "$GITHUB_STEP_SUMMARY"
              echo 'run=false' >> "$GITHUB_OUTPUT"
              exit
            fi
            expected="$(node -e 'const [a,b,c]=process.argv[1].split("."); console.log([a,b,BigInt(c)+1n].join("."))' "$anchor")"
            if [[ "$current" != "$expected" || ( "$published" != "$anchor" && "$published" != "$current" ) ]]; then
              echo 'A maintainer release is pending; no compatibility package prepared.' >> "$GITHUB_STEP_SUMMARY"
              echo 'run=false' >> "$GITHUB_OUTPUT"
              exit
            fi
            recover=true
          fi
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$anchor")"
          jq -e --arg tag "v$anchor" '.tag_name == $tag and .draft == false and .prerelease == false' <<< "$release" >/dev/null
          git fetch origin "refs/tags/v$anchor:refs/tags/v$anchor"
          if [[ "$anchor" == 2.0.0 ]]; then
            # The first v2 release predates the repository's immutability setting.
            test "$(git rev-parse 'v2.0.0^{commit}')" = '020ab806b7e55713a034b5097d1386594f750237'
            test "$(npm view dsh-chat-manager@2.0.0 dist.integrity)" = 'sha512-xQjYOBAyq49dVGUdFuq7Ln7zw0R4BZ6hBbQV4CLBQE7fijYMw88Q4UyEXIgTEb5gCJOeuxBWlZVQwaw2NC0Fvg=='
            jq -e 'any(.assets[]; .name == "dsh-chat-manager.tgz" and .digest == "sha256:2976009cbfdc97d8320a3bed7c0985d465a6b609c2baaf7ba199b51bb775a983")' <<< "$release" >/dev/null
          else
            jq -e '.immutable == true' <<< "$release" >/dev/null
          fi
          git merge-base --is-ancestor "v$anchor" HEAD
          git diff --exit-code "v$anchor" HEAD -- src lib assets locale cordis.patch.yml
          if [[ "$recover" == true ]]; then
            git diff --exit-code "v$anchor" HEAD -- . ':!package.json' ':!compatibility.json' \
              ':!.github/workflows/upstream-compatibility.yml' ':!.github/workflows/publish.yml' \
              ':!README.md' ':!README.en.md' ':!docs/assets/v2-*.png'
          else
            git diff --exit-code "v$anchor" HEAD -- package.json compatibility.json
          fi
          promote=false
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then promote=true; fi
          printf 'run=true\npromote=%s\nrecover=%s\n' "$promote" "$recover" >> "$GITHUB_OUTPUT"
          echo "Verified published v2 baseline v$anchor." >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate the exact official targets
        id: plan
        if: steps.candidate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER: ${{ steps.candidate.outputs.recover }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-compat-release.mjs > "$RUNNER_TEMP/compatibility-plan.json"
          jq -r '"changed=\(.changed)", "waiting=\(.waiting)", "versions=\(.targets|tojson)", "version=\(.version)"' \
            "$RUNNER_TEMP/compatibility-plan.json" | tee -a "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.plan.outputs.waiting == 'false' && (steps.plan.outputs.changed == 'true' || steps.candidate.outputs.recover == 'true' || github.event_name == 'workflow_dispatch')
        with: { version: 11.19.0, run_install: false }
      - name: Pack one candidate and preserve the exact archive
        id: package
        if: steps.plan.outputs.waiting == 'false' && (steps.plan.outputs.changed == 'true' || steps.candidate.outputs.recover == 'true' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run build
          git diff --exit-code -- lib
          pnpm pack --pack-destination .candidate
          mv .candidate/dsh-chat-manager-*.tgz .candidate/dsh-chat-manager.tgz
          echo "digest=$(sha256sum .candidate/dsh-chat-manager.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          git diff --binary -- package.json compatibility.json > .candidate/compatibility.patch
      - uses: actions/upload-artifact@v7
        if: steps.package.outcome == 'success'
        with:
          name: compatibility-${{ github.run_id }}
          path: .candidate/
          include-hidden-files: true
          if-no-files-found: error

  acceptance:
    needs: prepare
    if: needs.prepare.outputs.digest != ''
    uses: ./.github/workflows/official-acceptance.yml
    with:
      versions: ${{ needs.prepare.outputs.versions }}
      artifact: compatibility-${{ github.run_id }}

  publish:
    needs: [prepare, acceptance]
    if: github.event_name == 'schedule' && needs.prepare.outputs.promote == 'true' && needs.acceptance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with:
          name: compatibility-${{ github.run_id }}
          path: .candidate
      - name: Commit only the accepted peer and compatibility metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          DIGEST: ${{ needs.prepare.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$VERSION" =~ ^2\.[0-9]+\.[0-9]+$ && "$DIGEST" =~ ^[a-f0-9]{64}$ ]]
          git fetch origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(sha256sum .candidate/dsh-chat-manager.tgz | cut -d' ' -f1)" == "$DIGEST" ]]
          if [[ "$CHANGED" == true ]]; then
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo 'Release version is already in use.' >&2
              exit 1
            fi
            git apply --include=package.json --include=compatibility.json --index .candidate/compatibility.patch
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'chore: qualify the latest official DSH core'
            git push origin HEAD:main
          fi
          request="compat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh workflow run publish.yml --ref main -f release_kind=compatibility \
            -f request_id="$request" -f expected_sha="$(git rev-parse HEAD)" -f expected_digest="$DIGEST"
          for attempt in $(seq 1 60); do
            run="$(gh run list --workflow publish.yml --event workflow_dispatch --limit 30 \
              --json databaseId,displayTitle --jq ".[] | select(.displayTitle == \"Release $request\") | .databaseId")"
            if [[ -n "$run" ]]; then
              gh run watch "$run" --exit-status
              exit
            fi
            sleep 3
          done
          echo 'Release dispatch was not found.' >&2
          exit 1
