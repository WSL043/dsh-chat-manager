packages:
  - .
autoInstallPeers: false
minimumReleaseAge: 1440
# This bounded block is regenerated from pnpm-lock.yaml after a compatibility
# update so stale or newly introduced DeepSeek dependencies cannot slip through.
# dsh-compat-release-age-start
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.6-alpha.1'
  - '@deepseek-ai/cosmokit@1.8.7-alpha.1'
# dsh-compat-release-age-end
